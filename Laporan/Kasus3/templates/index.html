<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Kelulusan Seleksi - PMB</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 40px auto; line-height: 1.6; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #111; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        button:hover { background: #333; }
        #hasil { margin-top: 20px; padding: 12px; border: 1px solid #ccc; display: none; }
    </style>
</head>
<body>
    <h2>Prediksi Kelulusan Penerimaan Mahasiswa Baru</h2>
    <p>Masukkan komponen nilai seleksi calon mahasiswa (skala 0 - 100).</p>

    <div class="form-group">
        <label for="nilai_rapor">Rata-Rata Nilai Rapor (0 - 100):</label>
        <input type="number" id="nilai_rapor" step="0.1" min="0" max="100" placeholder="Contoh: 86.5" required>
    </div>

    <div class="form-group">
        <label for="skor_tes">Skor Tes Tertulis (0 - 100):</label>
        <input type="number" id="skor_tes" step="0.1" min="0" max="100" placeholder="Contoh: 82.0" required>
    </div>

    <div class="form-group">
        <label for="nilai_wawancara">Nilai Wawancara (0 - 100):</label>
        <input type="number" id="nilai_wawancara" step="0.1" min="0" max="100" placeholder="Contoh: 85.0" required>
    </div>

    <button onclick="prediksiKelulusan()">Prediksi Kelulusan</button>

    <div id="hasil"></div>

    <script>
        async function prediksiKelulusan() {
            const hasilDiv = document.getElementById("hasil");
            const payload = {
                nilai_rapor: parseFloat(document.getElementById("nilai_rapor").value),
                skor_tes: parseFloat(document.getElementById("skor_tes").value),
                nilai_wawancara: parseFloat(document.getElementById("nilai_wawancara").value)
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                hasilDiv.style.display = "block";

                if (response.ok) {
                    hasilDiv.innerHTML = `
                        <strong>Hasil Prediksi:</strong> ${data.label}<br>
                        <strong>Tingkat Keyakinan Model:</strong> ${(data.probabilitas * 100).toFixed(1)}%
                    `;
                } else {
                    hasilDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                }
            } catch (err) {
                hasilDiv.style.display = "block";
                hasilDiv.innerHTML = `<strong>Gagal terhubung ke API:</strong> ${err.message}`;
            }
        }
    </script>
</body>
</html>
