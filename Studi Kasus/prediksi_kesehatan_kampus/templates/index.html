<!--
File: templates/index.html
Deskripsi Studi Kasus:
    Sistem Informasi Kesehatan Kampus - Klasifikasi Tingkat Risiko Stres Mahasiswa.
    Antarmuka web skrining mandiri untuk mengevaluasi tingkat risiko stres mahasiswa
    berdasarkan pola tidur, beban SKS, dan aktivitas kerja paruh waktu.
Komponen Terkait:
    - Application Layer (HTML + JavaScript Fetch API): Mengirimkan jawaban kuesioner
      ke endpoint '/predict' dalam format JSON dan menampilkan klasifikasi risiko stres.
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skrining Risiko Stres Mahasiswa - Kesehatan Kampus</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 40px auto; line-height: 1.6; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #111; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        button:hover { background: #333; }
        #hasil { margin-top: 20px; padding: 12px; border: 1px solid #ccc; display: none; }
    </style>
</head>
<body>
    <h2>Kuesioner Tingkat Risiko Stres Mahasiswa</h2>
    <p>Isi data aktivitas harian Anda untuk mengetahui tingkat risiko stres saat ini.</p>

    <div class="form-group">
        <label for="jam_tidur">Rata-Rata Jam Tidur per Hari:</label>
        <input type="number" id="jam_tidur" step="0.5" min="0" max="24" placeholder="Contoh: 6.5" required>
    </div>

    <div class="form-group">
        <label for="beban_sks">Beban SKS Semester Ini:</label>
        <input type="number" id="beban_sks" min="1" max="24" placeholder="Contoh: 20" required>
    </div>

    <div class="form-group">
        <label for="jam_kerja">Jam Kerja Paruh Waktu per Minggu (0 jika tidak bekerja):</label>
        <input type="number" id="jam_kerja" step="0.5" min="0" placeholder="Contoh: 10" required>
    </div>

    <button onclick="cekStres()">Analisis Risiko Stres</button>

    <div id="hasil"></div>

    <script>
        async function cekStres() {
            const hasilDiv = document.getElementById("hasil");
            const payload = {
                jam_tidur: parseFloat(document.getElementById("jam_tidur").value),
                beban_sks: parseInt(document.getElementById("beban_sks").value),
                jam_kerja_paruh_waktu: parseFloat(document.getElementById("jam_kerja").value)
            };

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                hasilDiv.style.display = "block";

                if (response.ok) {
                    hasilDiv.innerHTML = `
                        <strong>Hasil Klasifikasi:</strong> ${data.label}<br>
                        <strong>Tingkat Keyakinan Model:</strong> ${(data.probabilitas * 100).toFixed(1)}%
                    `;
                } else {
                    hasilDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                }
            } catch (err) {
                hasilDiv.style.display = "block";
                hasilDiv.innerHTML = `<strong>Gagal terhubung ke API:</strong> ${err.message}`;
            }
        }
    </script>
</body>
</html>
